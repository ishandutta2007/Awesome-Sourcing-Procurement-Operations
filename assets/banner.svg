<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" style="background:#070b14; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="45%" stop-color="#0c172d" />
      <stop offset="85%" stop-color="#0f2142" />
      <stop offset="100%" stop-color="#141c33" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }

    @keyframes pulsePurple {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.5; }
    }

    @keyframes dashLine {
      to { stroke-dashoffset: -80; }
    }

    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatNodeLag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    .aurora-cyan {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 300px 100px;
    }

    .aurora-purple {
      animation: pulsePurple 10s ease-in-out infinite;
      transform-origin: 950px 250px;
    }

    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashLine 4s linear infinite;
    }

    .node-float-1 { animation: floatNode 5s ease-in-out infinite; }
    .node-float-2 { animation: floatNodeLag 6s ease-in-out infinite; }
    .node-float-3 { animation: floatNode 5.5s ease-in-out infinite; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="380" rx="12" fill="url(#bg-grad)" />

  <!-- Animated Background Glows -->
  <circle class="aurora-cyan" cx="260" cy="90" r="140" fill="#06b6d4" filter="url(#glow-soft)" />
  <circle class="aurora-purple" cx="980" cy="270" r="160" fill="#6366f1" filter="url(#glow-soft)" />
  <circle class="aurora-cyan" cx="820" cy="80" r="110" fill="#3b82f6" filter="url(#glow-soft)" opacity="0.3" />

  <!-- Circuit & Procurement Process Nodes (Background Layer) -->
  <g opacity="0.28">
    <!-- Connecting Workflow Lines -->
    <path class="flow-line" d="M 80 290 Q 250 240 420 300 T 780 270 T 1120 290" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 120 110 Q 340 70 560 120 T 920 90 T 1140 130" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <line class="flow-line" x1="160" y1="200" x2="1040" y2="200" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- Decorative Interactive Node Cards (Subtle Floating in Background) -->
  <g class="node-float-1" opacity="0.4">
    <rect x="70" y="50" width="130" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="135" y="73" fill="#7dd3fc" font-size="12" font-weight="600" text-anchor="middle">🎯 INTAKE &amp; RFQ</text>
  </g>

  <g class="node-float-2" opacity="0.4">
    <rect x="990" y="50" width="140" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="1060" y="73" fill="#c7d2fe" font-size="12" font-weight="600" text-anchor="middle">⚡ S2P PIPELINE</text>
  </g>

  <g class="node-float-3" opacity="0.4">
    <rect x="980" y="310" width="150" height="36" rx="18" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <text x="1055" y="333" fill="#67e8f9" font-size="12" font-weight="600" text-anchor="middle">🤖 AI ORCHESTRATION</text>
  </g>

  <!-- High-Contrast Foreground Content (Protected from background overlap) -->
  <g>
    <!-- Top Category Tag Pill -->
    <g transform="translate(60, 48)">
      <rect width="360" height="32" rx="16" fill="url(#badge-glow)" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="20" cy="16" r="5" fill="#38bdf8" filter="url(#glow-cyan)" />
      <text x="35" y="21" fill="#bae6fd" font-size="13" font-weight="600" letter-spacing="0.5">TOP SOURCING &amp; PROCUREMENT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="145" fill="url(#text-grad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Sourcing &amp; Procurement
    </text>
    <text x="60" y="195" fill="url(#cyan-blue)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Operations ⚡
    </text>

    <!-- Subtitle -->
    <text x="60" y="240" fill="#94a3b8" font-size="17" font-weight="400">
      Curated directory of SaaS Source-to-Pay leaders, AI intake orchestrators &amp; open-source engines.
    </text>
    <text x="60" y="266" fill="#64748b" font-size="14" font-weight="400">
      Benchmarked starting prices · Free tier &amp; trial limits · Company scale &amp; valuation · GitHub stars
    </text>

    <!-- Foreground Feature Pills -->
    <g transform="translate(60, 298)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="128" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="64" y="22" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">🛒 Source-to-Pay</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="138" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="209" y="22" fill="#818cf8" font-size="13" font-weight="600" text-anchor="middle">🎯 Strategic Sourcing</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="132" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="356" y="22" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">📊 Spend Analytics</text>

      <!-- Pill 4 -->
      <rect x="434" y="0" width="154" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="511" y="22" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">🤖 AI Sourcing Agents</text>

      <!-- Pill 5 -->
      <rect x="600" y="0" width="136" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="668" y="22" fill="#f472b6" font-size="13" font-weight="600" text-anchor="middle">💻 Open-Source ERP</text>
    </g>
  </g>

  <!-- Subtle High-Tech Corner Accent -->
  <line x1="1160" y1="20" x2="1180" y2="20" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <line x1="1180" y1="20" x2="1180" y2="40" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <line x1="20" y1="360" x2="40" y2="360" stroke="#818cf8" stroke-width="2" opacity="0.6" />
  <line x1="20" y1="340" x2="20" y2="360" stroke="#818cf8" stroke-width="2" opacity="0.6" />
</svg>
